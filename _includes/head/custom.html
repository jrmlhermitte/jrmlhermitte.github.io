<link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png">

  <!-- Begin SEO -->
  {% seo %}
  <!-- End SEO -->

  {% feed_meta %}

  {% if jekyll.environment == 'production' -%}
  <!-- Begin Google Analytics -->
  {% include head/google-analytics.html %}
  <!-- End Google Analytics -->
  {%- endif %}

  <!-- Fonts: Observatory Editorial (Fraunces + Source Sans 3 + IBM Plex Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <!-- End Fonts -->

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    mermaid.initialize({
      startOnLoad: true,
      theme: "dark",
      themeVariables: {
        background: "#0a101f",
        primaryColor: "#0f1930",
        primaryTextColor: "#f4f8ff",
        primaryBorderColor: "#38bdf8",
        lineColor: "#67e8f9",
        secondaryColor: "#141f38",
        tertiaryColor: "#1b2845",
        fontFamily: '"Source Sans 3", sans-serif'
      }
    });
  });
</script>
